name: ScoutFox Real-Page Corpus

# The real-page corpus job: replays the committed corpus (tests/fixtures/real) through the
# real content scripts in headless Chromium and asserts the hand-written expectations plus
# the baseline alarm (a drop in extracted text length or element count fails the job).
# See tests/fixtures/real/README.md and tests/e2e/replay-real.mjs.
#
# It stays off the normal PR path. It runs only:
#   - nightly at 03:15 UTC (the replay against the stored baseline), or
#   - by hand (Actions tab, "Run workflow"), with a choice of replay or refresh.
#
# The monthly refresh records the corpus again from the live web and uploads it as an
# artifact; committing the refreshed corpus is a human step (CI has no write token), and the
# baseline must be updated in the same change (see the README's rules).
#
# NOT YET VERIFIED ON GITHUB. The smoke test has only run on macOS so far; the same
# Chromium-install tuning notes as e2e.yml apply here.

on:
  schedule:
    # Nightly at 03:15 UTC, after the low-traffic window.
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "replay runs the corpus against the baseline; refresh records it again from the live web"
        required: true
        default: replay
        type: choice
        options:
          - replay
          - refresh

permissions:
  contents: read

jobs:
  corpus:
    name: Real-Page Corpus (${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'replay' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install E2E Dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium
        # From tests/e2e, so the copy of @puppeteer/browsers that `npm ci` installed from the
        # lockfile runs. The local bin is used on purpose: no `npx --yes`, no unpinned package.
        working-directory: tests/e2e
        run: |
          ./node_modules/.bin/browsers install chromium@latest --path "$RUNNER_TEMP/chromium"
          chromium_bin="$(find "$RUNNER_TEMP/chromium" -type f -name chrome -print -quit)"
          if [ -z "$chromium_bin" ]; then
            echo "::error::No chrome binary found under $RUNNER_TEMP/chromium"
            find "$RUNNER_TEMP/chromium" -maxdepth 4
            exit 1
          fi
          echo "Chromium binary: $chromium_bin"
          "$chromium_bin" --version
          echo "CHROMIUM_PATH=$chromium_bin" >> "$GITHUB_ENV"

      - name: Build the Extension
        run: npm run build

      - name: Replay the Corpus Against the Baseline
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'replay')
        env:
          CHROMIUM_ARGS: --no-sandbox
        run: |
          out="$RUNNER_TEMP/corpus-out"
          mkdir -p "$out"
          npm run test:replay -- --out="$out/replay-report.json"

      - name: Refresh the Corpus From the Live Web
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'refresh'
        env:
          CHROMIUM_ARGS: --no-sandbox
        run: |
          out="$RUNNER_TEMP/corpus-out"
          mkdir -p "$out"
          # The recorder fetches the live web on purpose. A page that refuses or times out is
          # left out and reported; the replay's audit in npm test keeps the corpus complete.
          node tests/e2e/record-real.mjs --timeout=60000
          npm run test:replay -- --update-baseline --out="$out/replay-report.json"

      - name: Upload the Report (and the Refreshed Corpus)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-page-corpus
          path: |
            ${{ runner.temp }}/corpus-out
            tests/fixtures/real
          if-no-files-found: error
