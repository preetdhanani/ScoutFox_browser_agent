name: ScoutFox AI Browser Agent CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-build:
    name: Run Syntax Checks & Test Suites
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate JavaScript Syntax across Extension Files
        run: npm run check

      - name: Execute Automated QA Test Suite
        run: npm test

      - name: Package Chrome Extension Zip Artifact
        if: matrix.node-version == '22.x' && github.event_name == 'push'
        run: |
          mkdir -p dist
          zip -r dist/scoutfox-chrome-extension.zip manifest.json background content sidepanel icons utils README.md LICENSE

      - name: Upload Extension Build Artifact
        if: matrix.node-version == '22.x' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: scoutfox-chrome-extension
          path: dist/scoutfox-chrome-extension.zip
