name: ScoutFox AI Browser Agent CI

# Runs on every push and pull request to main and dev.
# The browser e2e run is not part of this workflow: it needs a model key (see tests/e2e/README.md).
# No test retries anywhere: a flaky test is fixed, never retried.

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Run Syntax Checks & Test Suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Let both Node versions finish, so a failure that only one of them has is visible.
      fail-fast: false
      matrix:
        # package.json "engines" is node >=22.18, so nothing older is tested: the .ts sources and tests
        # run through Node's type stripping, which is on by default only from 22.18.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate JavaScript Syntax across Extension Files
        run: npm run check

      - name: Typecheck the TypeScript sources (tsc --noEmit)
        run: npm run typecheck

      - name: Execute Automated QA Test Suite
        run: npm test

      # The floor is what stops a refactor from deleting a hundred tests quietly. It only does
      # that job if it runs on every push, so it runs here and not only on a developer's machine.
      - name: Check the test count against the floor
        run: npm run check:tests

      - name: Build Extension into dist/
        run: npm run build

      - name: Scan dist/ for eval and new Function
        run: npm run evalscan

      - name: Zip dist/ for the Chrome Web Store
        run: npm run zip

      - name: Upload Extension Build Artifact
        if: matrix.node-version == '22.x' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: scoutfox-chrome-extension
          path: scoutfox-chrome-extension.zip
          if-no-files-found: error
