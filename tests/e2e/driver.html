<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tarka E2E driver</title>
</head>
<body>
  <!-- An empty extension page for tests/e2e/smoke.mjs. The smoke run copies dist/ into a temp
       folder, adds this file to the copy as driver.html (the only extra file) and loads the copy
       as the unpacked extension. This page then runs at chrome-extension://<id>/driver.html with
       the extension's own chrome.* APIs, so the smoke run can send the same messages the side panel
       sends: START_TASK, GET_AGENT_STATE, and the answers to a hold of the graph engine (APPROVE_PLAN,
       CONFIRM_ACTION, ANSWER_QUESTION, ...). It is never inside dist/ or the shipped zip, so users never get it. -->
  <p>Tarka E2E driver page.</p>
</body>
</html>
