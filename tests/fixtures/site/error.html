  <link rel="stylesheet" href="site.css">
</head>
<body>
  <!-- Fixture: a soft error page. It is served with status 200 like many real shops do, so
       only its text says that the page failed. -->

    <a class="logo" href="index.html">PreisFuchs</a>
  </header>
  <main>
    <h1>Diese Seite ist gerade nicht verfügbar</h1>
    <p>Fehler 503: Der Dienst ist vorübergehend überlastet. Bitte versuche es in ein paar Minuten noch einmal.</p>
    <p>Fehler-ID: 7f3a-91c2</p>
    <p><button type="button" onclick="location.reload()">Neu laden</button></p>
    <p><a href="index.html">Zur Startseite</a></p>
  </main>
</body>
</html>
