<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook - fixture</title>
  <link rel="stylesheet" href="site.css">
  <style>
    /* The page itself never scrolls, like JupyterLab: everything lives in a fixed frame. */
    html, body { height: 100%; overflow: hidden; }
    .frame { display: flex; flex-direction: column; height: 100%; }
    header.bar .status { margin-left: auto; color: var(--muted); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    main.notebook { flex: 1; padding: 24px; max-width: 880px; width: 100%; margin: 0 auto; }
    main.notebook p.hint { color: var(--muted); margin: 0 0 16px; }
    .cell { display: grid; grid-template-columns: 84px 1fr; gap: 8px 12px; align-items: start; }
    .cell .prompt { color: var(--muted); font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; padding-top: 9px; }
    .cell .editor {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      outline: none;
    }
    .cell .editor:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.15); }
    .cell .output { margin: 0; padding: 8px 12px; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <!-- Fixture: an editor like a notebook cell (CodeMirror, Monaco). Its text lives in its own JS
       model and is drawn from it, so a script that writes the DOM is undone at once. It only takes
       trusted input: a synthetic key or input event changes nothing. Shift+Enter "runs" the cell
       and writes one output line under it. The status ticker in the header changes all the time,
       like a kernel status or a clock does. -->
  <div class="frame">
    <header class="bar">
      <span class="logo">Notebook</span>
      <span class="status" id="ticker">Kernel idle - tick 0</span>
    </header>
    <main class="notebook">
      <p class="hint">Edit the cell, then press Shift+Enter to run it.</p>
      <div class="cell">
        <div class="prompt" id="in-prompt">In [1]:</div>
        <div id="editor" class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Code cell editor" spellcheck="false"></div>
        <div class="prompt">Out:</div>
        <pre id="output" class="output"></pre>
      </div>
    </main>
  </div>
  <script>
    (function () {
      const editor = document.getElementById('editor');
      const output = document.getElementById('output');
      const ticker = document.getElementById('ticker');
      // The model is the truth. The DOM is only a drawing of it.
      let model = 'sudo apt install ollama';
      let runs = 1;
      let drawing = false;

      function draw(caret) {
        drawing = true;
        editor.textContent = model;
        drawing = false;
        if (typeof caret === 'number' && document.activeElement === editor) {
          const node = editor.firstChild || editor;
          const range = document.createRange();
          range.setStart(node, Math.min(caret, node.nodeType === 3 ? node.length : 0));
          range.collapse(true);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }
        document.body.setAttribute('data-editor-text', model);
      }

      // Any change to the DOM that did not come from the model (a script writing textContent) is undone.
      new MutationObserver(() => {
        if (!drawing && editor.textContent !== model) draw();
      }).observe(editor, { childList: true, characterData: true, subtree: true });

      /** The selection as offsets into the model. */
      function selectionOffsets() {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return { start: model.length, end: model.length };
        const range = sel.getRangeAt(0);
        if (!editor.contains(range.startContainer) && range.startContainer !== editor) return { start: model.length, end: model.length };
        const offsetOf = (container, offset) => {
          const before = document.createRange();
          before.selectNodeContents(editor);
          before.setEnd(container, offset);
          return before.toString().length;
        };
        return { start: offsetOf(range.startContainer, range.startOffset), end: offsetOf(range.endContainer, range.endOffset) };
      }

      function replaceSelection(text) {
        const { start, end } = selectionOffsets();
        model = model.slice(0, start) + text + model.slice(end);
        draw(start + text.length);
      }

      // Every edit the editor sees, for the harness: a run whose end text is wrong reports how it got there.
      const editLog = [];
      function logEdit(what) {
        editLog.push(what);
        if (editLog.length > 30) editLog.shift();
        document.body.setAttribute('data-editor-log', JSON.stringify(editLog));
      }

      editor.addEventListener('beforeinput', (event) => {
        // The editor does its own editing: the browser never touches the DOM.
        if (event.cancelable) event.preventDefault();
        logEdit(`beforeinput ${event.inputType} ${JSON.stringify(event.data)} trusted=${event.isTrusted} cancelable=${event.cancelable}`);
        if (!event.isTrusted) return;
        const { start, end } = selectionOffsets();
        switch (event.inputType) {
          case 'insertText':
          case 'insertReplacementText':
          case 'insertFromPaste':
            replaceSelection(event.data != null ? event.data : (event.dataTransfer ? event.dataTransfer.getData('text/plain') : ''));
            break;
          case 'insertParagraph':
          case 'insertLineBreak':
            replaceSelection('\n');
            break;
          case 'deleteContentBackward':
            if (start === end && start > 0) { model = model.slice(0, start - 1) + model.slice(end); draw(start - 1); } else replaceSelection('');
            break;
          case 'deleteContentForward':
            if (start === end) { model = model.slice(0, start) + model.slice(end + 1); draw(start); } else replaceSelection('');
            break;
          default:
            if (event.inputType.startsWith('delete')) replaceSelection('');
        }
      });

      // An input the browser applied without a cancelable beforeinput (an IME commit) is trusted
      // too: the model takes the DOM's text then. A script's write fires no input event.
      editor.addEventListener('input', (event) => {
        logEdit(`input ${event.inputType} ${JSON.stringify(event.data)} trusted=${event.isTrusted} dom=${JSON.stringify(editor.textContent)}`);
        if (!event.isTrusted) { draw(); return; }
        if (editor.textContent !== model) {
          model = editor.textContent;
          document.body.setAttribute('data-editor-text', model);
        }
      });

      function run() {
        logEdit(`run ${JSON.stringify(model)}`);
        runs += 1;
        const code = model.trim();
        const echo = /^echo\s+(.*)$/s.exec(code);
        const result = echo ? echo[1].trim() : `${code.split(/\s+/)[0] || '(empty)'}: command not found`;
        output.textContent = `Out [${runs}]: ${result}`;
        document.getElementById('in-prompt').textContent = `In [${runs}]:`;
        document.body.setAttribute('data-runs', String(runs));
      }

      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && event.shiftKey) {
          event.preventDefault();
          if (event.isTrusted) run();
        }
      });

      draw();
      output.textContent = 'Out [1]: sudo: command not found';
      document.body.setAttribute('data-runs', '1');

      let tick = 0;
      setInterval(() => {
        tick += 1;
        ticker.textContent = `Kernel idle - tick ${tick}`;
      }, 250);
    })();
  </script>
</body>
</html>
