<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders - fixture</title>
  <link rel="stylesheet" href="site.css">
  <style>
    /* The page never scrolls: only the list does, and it draws only the rows near the view. */
    html, body { height: 100%; overflow: hidden; }
    .frame { display: flex; flex-direction: column; height: 100%; }
    main.orders { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 16px 24px; max-width: 880px; width: 100%; margin: 0 auto; }
    main.orders h1 { font-size: 20px; margin: 0 0 4px; }
    main.orders p.hint { color: var(--muted); margin: 0 0 12px; }
    .list { position: relative; flex: 1; min-height: 0; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
    .list .spacer { position: relative; }
    .list .row { position: absolute; left: 0; right: 0; height: 36px; padding: 0 14px; display: flex; align-items: center; border-bottom: 1px solid var(--line); font-size: 14px; }
    .list .row.alt { background: var(--panel); }
  </style>
</head>
<body>
  <!-- Fixture: a windowed list like the ones of Gmail, Slack or a data grid. 500 orders, and only
       the rows near the view are in the DOM (about 25 of them), so the far ones can only be read
       after the list is scrolled to them. The window itself does not scroll. -->
  <div class="frame">
    <header class="bar">
      <span class="logo">Orders</span>
    </header>
    <main class="orders">
      <h1>All orders</h1>
      <p class="hint">500 orders, newest last. Scroll the list to see more.</p>
      <div class="list" id="orders" role="list" aria-label="Order list"><div class="spacer" id="spacer"></div></div>
    </main>
  </div>
  <script src="virtual-list-data.js"></script>
  <script>
    (function () {
      const { rows, rowText } = window.VIRTUAL_ORDERS;
      const ROW_HEIGHT = 36;
      const OVERSCAN = 3;
      const list = document.getElementById('orders');
      const spacer = document.getElementById('spacer');
      spacer.style.height = `${rows.length * ROW_HEIGHT}px`;
      let drawn = '';
      function draw() {
        const first = Math.max(0, Math.floor(list.scrollTop / ROW_HEIGHT) - OVERSCAN);
        const last = Math.min(rows.length, Math.ceil((list.scrollTop + list.clientHeight) / ROW_HEIGHT) + OVERSCAN);
        const key = `${first}-${last}`;
        if (key === drawn) return;
        drawn = key;
        spacer.replaceChildren(...rows.slice(first, last).map((r, k) => {
          const el = document.createElement('div');
          el.className = (first + k) % 2 ? 'row alt' : 'row';
          el.setAttribute('role', 'listitem');
          el.style.top = `${(first + k) * ROW_HEIGHT}px`;
          el.textContent = rowText(r);
          return el;
        }));
        document.body.setAttribute('data-rows-drawn', String(last - first));
      }
      list.addEventListener('scroll', draw, { passive: true });
      window.addEventListener('resize', draw);
      draw();
    })();
  </script>
</body>
</html>
