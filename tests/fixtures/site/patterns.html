<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurator widgets - Fixture Shop</title>
  <link rel="stylesheet" href="site.css">
  <style>
    /* The four patterns the element selector once missed, each the way a real shop builds it. */
    .choice input[type="radio"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .choice label {
      cursor: pointer;
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 4px 4px 4px 0;
    }
    .swatch {
      cursor: pointer;
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin: 4px 4px 4px 0;
    }
    .menu [role="option"] { padding: 6px 10px; }
  </style>
</head>
<body>
<main>
  <h1>Configurator widgets</h1>
  <p>Every widget on this page stands for one pattern an element selector can miss.</p>

  <section>
    <h2>Disclosure</h2>
    <details id="shipping-info">
      <summary>Shipping and returns</summary>
      <p>Returns are accepted within 30 days of delivery.</p>
    </details>
  </section>

  <section>
    <h2>Storage</h2>
    <div class="choice">
      <!-- The native radio is invisible; the styled label is the only thing a user can click. -->
      <input type="radio" id="storage-512" name="storage" value="512">
      <label for="storage-512">512 GB</label>
      <input type="radio" id="storage-1tb" name="storage" value="1000">
      <label for="storage-1tb">1 TB</label>
    </div>
  </section>

  <section>
    <h2>Colour</h2>
    <!-- Clickable only through the addEventListener handler below. -->
    <div class="swatch" data-colour="Midnight Black">Midnight Black</div>
    <div class="swatch" data-colour="Silver">Silver</div>
    <p id="colour-status">No colour chosen yet.</p>
  </section>

  <section>
    <h2>Batch size</h2>
    <div class="menu" role="listbox" aria-label="Batch size">
      <div role="option" id="batch-1">Batch of 1</div>
      <div role="option" id="batch-5">Batch of 5</div>
    </div>
  </section>
</main>

<script>
  document.querySelectorAll('.swatch').forEach((el) => {
    el.addEventListener('click', () => {
      document.getElementById('colour-status').textContent = 'Chosen colour: ' + el.dataset.colour;
    });
  });
</script>
</body>
</html>
